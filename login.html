<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Vivero Escobar</title>

  <!-- aplica el tema guardado (claro u oscuro) antes de mostrar la pagina -->
  <script>
    try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tema') || 'light'); } catch (e) {}
  </script>

  <!-- bootstrap, fuentes y estilos propios -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <div class="login-pagina">
    <button type="button" class="btn-tema btn-tema-login" id="tema">🌙 Oscuro</button>
    <div class="login-izq">
      <a class="navbar-brand" href="index.html">🌿 Vivero Escobar</a>
      <div>
        <h1>Qué bueno<br>verte de nuevo.</h1>
        <p>Entra a tu cuenta para ver el inventario y armar tu carrito.</p>
      </div>
    </div>
    <div class="login-der">
      <div class="tarjeta-login">
        <h2>Iniciar sesión</h2>
        <p class="text-muted small">Usa tu correo y contraseña.</p>
        <div id="aviso" class="alert alert-danger py-2 small d-none" role="alert">Escribe tu correo y tu contraseña.</div>
        <div class="mb-3">
          <label for="correo" class="form-label small fw-bold">Correo</label>
          <input type="email" id="correo" class="form-control" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="mb-3">
          <label for="clave" class="form-label small fw-bold">Contraseña</label>
          <input type="password" id="clave" class="form-control">
        </div>
        <button id="entrar" class="btn btn-rosa w-100 py-2">Iniciar sesión</button>
        <div class="text-center mt-3"><a href="#">¿Olvidaste tu contraseña?</a></div>
      </div>
    </div>
  </div>

  <footer class="text-center py-3">Vivero Escobar © 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    // revisa que los campos no esten vacios y entra al inventario
    document.getElementById('entrar').addEventListener('click', function () {
        const correo = document.getElementById('correo').value.trim();
        const clave = document.getElementById('clave').value.trim();
        if (correo === '' || clave === '') {
            document.getElementById('aviso').classList.remove('d-none');
        } else {
            window.location.href = 'inventario.html';
        }
    });
  </script>
</body>
</html>
